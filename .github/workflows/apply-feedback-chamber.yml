name: Apply GPU Feedback Chamber

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ori/gpu-feedback-chamber-v04

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Integrate Feedback Chamber UI
        run: node scripts/integrate-gpu-feedback-chamber.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Auralith369.jsx tests/e2e/editor-smoke.spec.js package.json package-lock.json README.md
          git commit -m "Integrate GPU Lab v0.4 Feedback Chamber"
          git push origin HEAD:ori/gpu-feedback-chamber-v04
