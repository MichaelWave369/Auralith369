name: Apply GPU Cartridge Bay

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ori/gpu-cartridge-bay-v02

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Integrate Cartridge Bay
        run: node scripts/integrate-gpu-cartridge-bay.mjs

      - name: Refresh lockfile
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Auralith369.jsx package.json package-lock.json README.md tests/e2e/editor-smoke.spec.js
          git commit -m "Integrate GPU Lab v0.2 Cartridge Bay"
          git push origin HEAD:ori/gpu-cartridge-bay-v02
