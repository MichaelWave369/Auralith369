name: Apply GPU fallback test fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ori/gpu-lab-release

      - name: Apply repair
        run: node scripts/fix-gpu-fallback-test.mjs

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/editor-smoke.spec.js
          git rm scripts/fix-gpu-fallback-test.mjs
          git commit -m "Test GPU fallback by control availability"
          git push origin HEAD:ori/gpu-lab-release
