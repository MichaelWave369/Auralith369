name: Apply GPU Lab browser gate fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ori/gpu-lab-release

      - name: Apply repair
        run: node scripts/fix-gpu-lab-ci.mjs

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Auralith369.jsx tests/e2e/editor-smoke.spec.js tests/renderingGuard.test.js
          git rm scripts/fix-gpu-lab-ci.mjs
          git commit -m "Fix GPU Lab browser gate and numeric UI guards"
          git push origin HEAD:ori/gpu-lab-release
