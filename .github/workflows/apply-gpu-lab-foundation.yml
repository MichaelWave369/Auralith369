name: Apply GPU Lab foundation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GPU branch
        uses: actions/checkout@v4
        with:
          ref: ori/gpu-lab-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Integrate, validate, and record result
        shell: bash
        run: |
          set +e
          rm -f docs/GPU_LAB_INTEGRATION_FAILURE.log
          {
            node scripts/integrate-gpu-lab.mjs &&
            npm install --package-lock-only &&
            npm ci &&
            npm test &&
            npm run build
          } > /tmp/gpu-lab-integration.log 2>&1
          status=$?
          cat /tmp/gpu-lab-integration.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            cp /tmp/gpu-lab-integration.log docs/GPU_LAB_INTEGRATION_FAILURE.log
            git add docs/GPU_LAB_INTEGRATION_FAILURE.log
            git commit -m "Record GPU Lab integration failure" || true
            git push origin HEAD:ori/gpu-lab-foundation
            exit "$status"
          fi

          git add package.json package-lock.json README.md RELEASE_NOTES_v0.2.0-alpha.md src/Auralith369.jsx tests/e2e/editor-smoke.spec.js
          git rm -f docs/GPU_LAB_INTEGRATION_FAILURE.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "GPU Lab integration already applied."
            exit 0
          fi
          git commit -m "Integrate optional GPU Lab preview"
          git push origin HEAD:ori/gpu-lab-foundation
