name: Apply GPU Lab foundation

on:
  push:
    branches: [ori/gpu-lab-foundation]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Integrate GPU Lab into the editor
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const editorPath = 'src/Auralith369.jsx';
          const e2ePath = 'tests/e2e/editor-smoke.spec.js';
          const readmePath = 'README.md';
          const packagePath = 'package.json';

          const replaceOnce = (source, before, after, label) => {
            if (source.includes(after)) return source;
            if (!source.includes(before)) throw new Error(`Could not locate ${label}`);
            return source.replace(before, after);
          };

          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          pkg.version = '0.2.0-alpha';
          pkg.dependencies = { ...pkg.dependencies, three: '^0.185.1' };
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          let source = fs.readFileSync(editorPath, 'utf8');

          source = replaceOnce(
            source,
            'import { clearRecoverySnapshot, loadRecoverySnapshot, saveRecoverySnapshot } from "./lib/sessionRecovery.js";\n',
            'import { clearRecoverySnapshot, loadRecoverySnapshot, saveRecoverySnapshot } from "./lib/sessionRecovery.js";\nimport GpuLabPreview from "./gpu/GpuLabPreview.jsx";\nimport { GPU_LAB_DEFAULTS, normalizeGpuLabProjectState, normalizeGpuLabSettings } from "./gpu/gpuLabDefaults.js";\n',
            'GPU Lab imports'
          );
          source = source.replace('const APP_VERSION="v0.1.0-alpha";', 'const APP_VERSION="v0.2.0-alpha";');

          source = replaceOnce(
            source,
            '  const mcR=useRef(null),olR=useRef(null),mnR=useRef(null),fR=useRef(null);\n',
            '  const mcR=useRef(null),olR=useRef(null),mnR=useRef(null),fR=useRef(null);\n  const gpuPreviewRef=useRef(null);\n',
            'GPU preview ref'
          );

          source = replaceOnce(
            source,
            '  const[recoveryCandidate,setRecoveryCandidate]=useState(null);const[recoverySavedAt,setRecoverySavedAt]=useState("");\n',
            '  const[recoveryCandidate,setRecoveryCandidate]=useState(null);const[recoverySavedAt,setRecoverySavedAt]=useState("");\n  const[gpuEnabled,setGpuEnabled]=useState(0);\n  const[gpuSettings,setGpuSettings]=useState(()=>normalizeGpuLabSettings(GPU_LAB_DEFAULTS));\n  const[gpuStatus,setGpuStatus]=useState({supported:null,active:false,reason:"Checking WebGL2…"});\n  const setGpuValue=(group,key,value)=>setGpuSettings(current=>normalizeGpuLabSettings({...current,[group]:{...current[group],[key]:value}}));\n',
            'GPU Lab state'
          );

          source = replaceOnce(
            source,
            'const rendered=renderCompositeCanvas({checker:1,split:1});mc.width=sz.w;mc.height=sz.h;const ctx=mc.getContext("2d");mc.style.filter="none";ctx.clearRect(0,0,sz.w,sz.h);ctx.drawImage(rendered,0,0);',
            'const rendered=renderCompositeCanvas({checker:0,split:1});mc.width=sz.w;mc.height=sz.h;const ctx=mc.getContext("2d");mc.style.filter="none";ctx.clearRect(0,0,sz.w,sz.h);dCk(ctx,sz.w,sz.h);ctx.drawImage(rendered,0,0);gpuPreviewRef.current?.render(rendered);',
            'GPU composite synchronization'
          );

          source = replaceOnce(
            source,
            'quickActions:quickA,dominantColors:domColors};},[projectName,sz,aL,layers,adj,ovl,oOp,guides,snapOn,snapTol,captionTone,fg,bg_,txt,tF,tSz,txtFx,savedBatches,versions,quickA,domColors]);',
            'quickActions:quickA,dominantColors:domColors,gpuLab:{enabled:!!gpuEnabled,settings:normalizeGpuLabSettings(gpuSettings)}};},[projectName,sz,aL,layers,adj,ovl,oOp,guides,snapOn,snapTol,captionTone,fg,bg_,txt,tF,tSz,txtFx,savedBatches,versions,quickA,domColors,gpuEnabled,gpuSettings]);',
            'GPU project metadata'
          );

          source = replaceOnce(
            source,
            'setDomColors(raw.dominantColors||[]);setHasI(1);',
            'setDomColors(raw.dominantColors||[]);const gpuProject=normalizeGpuLabProjectState(raw.gpuLab);setGpuEnabled(gpuProject.enabled?1:0);setGpuSettings(gpuProject.settings);setHasI(1);',
            'GPU project restoration'
          );

          source = replaceOnce(
            source,
            'setQuickA([]);setCaptionTone("mythic");setTimeout(()=>save("New Canvas"),0);',
            'setQuickA([]);setCaptionTone("mythic");setGpuEnabled(0);setGpuSettings(normalizeGpuLabSettings(GPU_LAB_DEFAULTS));setTimeout(()=>save("New Canvas"),0);',
            'GPU reset behavior'
          );

          source = replaceOnce(
            source,
            '  const doExp=()=>{const ec=renderCompositeCanvas({checker:0,background:eF==="JPEG"?"#fff":null});downloadCanvas(ec,`${projectName||"auralith369"}.${eF.toLowerCase()}`);flash("Exported!");};\n',
            '  const doExp=()=>{const ec=renderCompositeCanvas({checker:0,background:eF==="JPEG"?"#fff":null});downloadCanvas(ec,`${projectName||"auralith369"}.${eF.toLowerCase()}`);flash("Exported!");};\n  const exportGpuFrame=()=>{const dataUrl=gpuPreviewRef.current?.captureDataURL("image/png");if(!dataUrl){flash("GPU preview unavailable");return;}const a=document.createElement("a");a.download=`${projectName||"auralith369"}.gpu.png`;a.href=dataUrl;a.click();flash("GPU frame exported");};\n',
            'GPU export function'
          );

          source = replaceOnce(
            source,
            'overlay:{id:ovl,opacity:oOp},history:hNm.slice(-36),export:{format:eF,quality:eQ}};',
            'overlay:{id:ovl,opacity:oOp},gpuLab:{enabled:!!gpuEnabled,settings:normalizeGpuLabSettings(gpuSettings)},history:hNm.slice(-36),export:{format:eF,quality:eQ}};',
            'GPU receipt metadata'
          );

          source = replaceOnce(
            source,
            'dominantColors:domColors,caption:makeCaption(),historyTail:hNm.slice(-18)};',
            'dominantColors:domColors,gpuLab:{enabled:!!gpuEnabled,settings:normalizeGpuLabSettings(gpuSettings)},caption:makeCaption(),historyTail:hNm.slice(-18)};',
            'GPU manifest metadata'
          );
          source = replaceOnce(
            source,
            '`- Snap: ${snapOn?"on":"off"} / ${snapTol}px`,"","## Caption"',
            '`- Snap: ${snapOn?"on":"off"} / ${snapTol}px`,`- GPU Lab: ${gpuEnabled?"on":"off"}${gpuEnabled?` · ${gpuStatus.active?"three-webgl2":"fallback"}`:""}`,"","## Caption"',
            'GPU manifest summary'
          );

          source = source.replaceAll(
            '["layers","fx","lut","style","forge","adj","plug","act","exp"]',
            '["layers","fx","lut","style","forge","adj","gpu","plug","act","exp"]'
          );

          source = replaceOnce(
            source,
            '            <canvas ref={mcR} width={sz.w} height={sz.h} style={{display:"block",cursor}} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}/>\n            <canvas ref={olR}',
            '            <canvas ref={mcR} width={sz.w} height={sz.h} style={{display:"block",cursor}} onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}/>\n            <GpuLabPreview ref={gpuPreviewRef} enabled={!!gpuEnabled} width={sz.w} height={sz.h} settings={gpuSettings} onStatus={setGpuStatus}/>\n            <canvas ref={olR}',
            'GPU preview canvas'
          );

          const gpuPanel = `          {rT==="gpu"&&<>
            <Hd ic="◈">GPU Lab v0.1</Hd>
            <div data-testid="gpu-capability" style={{padding:4,background:C.srf,borderRadius:3,border:\`1px solid \${gpuStatus.active?C.ac:C.bd}\`,fontSize:6,color:gpuStatus.supported===false?C.rd:gpuStatus.active?C.ac:C.td,lineHeight:1.45,marginBottom:3}}>{gpuStatus.supported===null?"Checking WebGL2…":gpuStatus.supported?(gpuStatus.active?"WebGL2 active · Three.js shader preview":"WebGL2 ready · Canvas 2D remains active"):gpuStatus.reason}</div>
            <button onClick={()=>setGpuEnabled(value=>value?0:1)} disabled={gpuStatus.supported===false} style={{width:"100%",padding:"5px 7px",background:gpuEnabled?\`linear-gradient(135deg,\${C.ac},\${C.pr})\`:C.srf,color:gpuEnabled?C.bg:C.tx,border:\`1px solid \${gpuEnabled?C.ac:C.bd}\`,borderRadius:3,cursor:gpuStatus.supported===false?"not-allowed":"pointer",fontWeight:700,fontSize:7,fontFamily:FN,opacity:gpuStatus.supported===false?.55:1}}>{gpuEnabled?"Disable GPU Preview":"Enable GPU Preview"}</button>
            {gpuStatus.renderer&&<div style={{fontSize:5.5,color:C.tm,marginTop:3,wordBreak:"break-word"}}>{gpuStatus.renderer} · max texture {gpuStatus.maxTextureSize||"?"}px</div>}
            <Hd ic="▤">CRT Signal</Hd>
            <Bt a={gpuSettings.crt.enabled} onClick={()=>setGpuValue("crt","enabled",!gpuSettings.crt.enabled)} sm>{gpuSettings.crt.enabled?"CRT On":"CRT Off"}</Bt>
            <Sl l="Curvature" v={gpuSettings.crt.curvature*100} mn={0} mx={35} ch={value=>setGpuValue("crt","curvature",value/100)} u="%" c={C.pr}/>
            <Sl l="Scanlines" v={gpuSettings.crt.scanlineIntensity*100} mn={0} mx={60} ch={value=>setGpuValue("crt","scanlineIntensity",value/100)} u="%"/>
            <Sl l="Density" v={gpuSettings.crt.scanlineCount} mn={120} mx={2160} s={60} ch={value=>setGpuValue("crt","scanlineCount",value)}/>
            <Sl l="RGB Split" v={gpuSettings.crt.chromaticAberration} mn={0} mx={8} s={.1} ch={value=>setGpuValue("crt","chromaticAberration",value)} u="px" c={C.cy}/>
            <Sl l="Vignette" v={gpuSettings.crt.vignette*100} mn={0} mx={80} ch={value=>setGpuValue("crt","vignette",value/100)} u="%"/>
            <Sl l="Signal Noise" v={gpuSettings.crt.noise*1000} mn={0} mx={120} ch={value=>setGpuValue("crt","noise",value/1000)} u="‰"/>
            <Hd ic="✦">Aura Bloom</Hd>
            <Bt a={gpuSettings.bloom.enabled} onClick={()=>setGpuValue("bloom","enabled",!gpuSettings.bloom.enabled)} sm>{gpuSettings.bloom.enabled?"Bloom On":"Bloom Off"}</Bt>
            <Sl l="Strength" v={gpuSettings.bloom.strength*100} mn={0} mx={250} ch={value=>setGpuValue("bloom","strength",value/100)} u="%" c={C.pr}/>
            <Sl l="Radius" v={gpuSettings.bloom.radius*100} mn={0} mx={100} ch={value=>setGpuValue("bloom","radius",value/100)} u="%"/>
            <Sl l="Threshold" v={gpuSettings.bloom.threshold*100} mn={0} mx={100} ch={value=>setGpuValue("bloom","threshold",value/100)} u="%" c={C.gd}/>
            <div style={{display:"flex",gap:2,marginTop:4}}><Bt onClick={()=>setGpuSettings(normalizeGpuLabSettings(GPU_LAB_DEFAULTS))} sm style={{flex:1}}>Reset</Bt><Bt onClick={exportGpuFrame} sm style={{flex:1,color:gpuStatus.active?C.ac:C.tm}}>Export GPU PNG</Bt></div>
            <div style={{marginTop:5,padding:4,background:C.srf,borderRadius:3,border:\`1px solid \${C.bd}\`,fontSize:5.5,color:C.tm,lineHeight:1.5}}>Non-destructive preview. Canvas 2D remains the authority for layers, masks, undo, recovery, receipts, and standard exports.</div>
          </>}

`;
          source = replaceOnce(
            source,
            '          {rT==="plug"&&<>\n',
            `${gpuPanel}          {rT==="plug"&&<>\n`,
            'GPU Lab inspector panel'
          );

          source = replaceOnce(
            source,
            'Auralith369 {APP_VERSION} ∴ PHI369 Labs · Snap:{snapOn?"on":"off"}{recoverySavedAt?" · Recovery saved":""}',
            'Auralith369 {APP_VERSION} ∴ PHI369 Labs · Snap:{snapOn?"on":"off"} · GPU:{gpuEnabled?(gpuStatus.active?"on":"fallback"):"off"}{recoverySavedAt?" · Recovery saved":""}',
            'GPU status line'
          );

          fs.writeFileSync(editorPath, source);

          let e2e = fs.readFileSync(e2ePath, 'utf8');
          e2e = e2e.replace(
            "['layers', 'fx', 'lut', 'style', 'forge', 'adj', 'plug', 'act', 'exp']",
            "['layers', 'fx', 'lut', 'style', 'forge', 'adj', 'gpu', 'plug', 'act', 'exp']"
          );
          if (!e2e.includes("GPU Lab exposes")) {
            e2e += `

test('GPU Lab exposes a live WebGL2 preview or a clean fallback', async ({ page, browserName }) => {
  const errors = collectPageErrors(page);
  await page.goto('./');
  await page.getByRole('button', { name: 'gpu', exact: true }).click();
  await expect(page.getByText('GPU Lab v0.1', { exact: true })).toBeVisible();

  const capability = page.getByTestId('gpu-capability');
  await expect(capability).not.toContainText('Checking WebGL2', { timeout: 12_000 });
  const capabilityText = await capability.textContent();

  if (capabilityText?.includes('WebGL2')) {
    await page.getByRole('button', { name: 'Enable GPU Preview', exact: true }).click();
    await expect(page.getByTestId('gpu-preview-canvas')).toHaveAttribute('data-gpu-preview', 'active', { timeout: 12_000 });
    await drawStroke(page);

    if (browserName === 'chromium') {
      const downloadPromise = page.waitForEvent('download');
      await page.getByRole('button', { name: 'Export GPU PNG', exact: true }).click();
      const download = await downloadPromise;
      expect(download.suggestedFilename()).toMatch(/\.gpu\.png$/);
    }
  } else {
    await expect(capability).toContainText(/unavailable|could not create/i);
    await expect(page.getByTestId('gpu-preview-canvas')).toHaveAttribute('data-gpu-preview', 'inactive');
  }

  await expect(page.getByText('Auralith369 runtime error')).toHaveCount(0);
  expect(errors).toEqual([]);
});
`;
          }
          fs.writeFileSync(e2ePath, e2e);

          let readme = fs.readFileSync(readmePath, 'utf8');
          readme = readme.replace('RELEASE_NOTES_v0.1.0-alpha.md', 'RELEASE_NOTES_v0.2.0-alpha.md');
          if (!readme.includes('Optional Three.js/WebGL2 GPU Lab')) {
            readme = readme.replace(
              '- Version snapshots and social pack export oriented pipeline\n',
              '- Version snapshots and social pack export oriented pipeline\n- Optional Three.js/WebGL2 GPU Lab with CRT Signal, Aura Bloom, and explicit GPU-frame export\n'
            );
          }
          if (!readme.includes('## GPU Lab boundary')) {
            readme = readme.replace(
              '## Local Setup\n',
              `## GPU Lab boundary

GPU Lab is an optional non-destructive preview renderer. Canvas 2D remains authoritative for project files, editing tools, layers, masks, undo/redo, recovery, receipts, manifests, and standard exports. See \`docs/GPU_LAB_ARCHITECTURE.md\`.

## Local Setup
`
            );
          }
          fs.writeFileSync(readmePath, readme);

          fs.writeFileSync('RELEASE_NOTES_v0.2.0-alpha.md', `# Auralith369 v0.2.0-alpha

## GPU Lab foundation

- Adds an optional Three.js renderer on an explicit WebGL2 context.
- Adds CRT Signal controls for curvature, scanlines, chromatic separation, vignette, and signal noise.
- Adds thresholded multi-tap Aura Bloom controls.
- Adds a separate pointer-transparent preview canvas and explicit GPU PNG export.
- Saves GPU settings as optional \`.auralith\` metadata and records them in receipts and manifests.
- Preserves Canvas 2D as the authority layer with a clean fallback when WebGL2 is unavailable.

## Stability

- Existing Canvas 2D tests, project round trips, recovery, edge tools, and performance gates remain release requirements.
- Browser smoke coverage now opens the GPU panel and exercises either a live preview or the explicit fallback path.
`);
          NODE

      - name: Update dependency lock
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json README.md RELEASE_NOTES_v0.2.0-alpha.md src/Auralith369.jsx tests/e2e/editor-smoke.spec.js
          if git diff --cached --quiet; then
            echo "GPU Lab integration already applied."
            exit 0
          fi
          git commit -m "Integrate optional GPU Lab preview"
          git push
