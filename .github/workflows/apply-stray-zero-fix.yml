name: Apply stray zero fix

on:
  push:
    branches: [ori/remove-stray-zero]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove numeric conditional artifact
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const editorPath = 'src/Auralith369.jsx';
          const testPath = 'tests/renderingGuard.test.js';
          let source = fs.readFileSync(editorPath, 'utf8');
          const before = '{drOv&&<div';
          const after = '{Boolean(drOv)&&<div';

          if (source.includes(before)) {
            source = source.replace(before, after);
            fs.writeFileSync(editorPath, source);
          } else if (!source.includes(after)) {
            throw new Error('Could not locate the drag-overlay conditional.');
          }

          fs.writeFileSync(testPath, `import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          test('numeric UI flags cannot leak a visible zero into the canvas', () => {
            const source = fs.readFileSync('src/Auralith369.jsx', 'utf8');
            assert.ok(source.includes('{Boolean(drOv)&&<div'));
            assert.ok(!source.includes('{drOv&&<div'));
          });
          `);
          NODE

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Auralith369.jsx tests/renderingGuard.test.js
          if git diff --cached --quiet; then
            echo "Repair already applied."
            exit 0
          fi
          git commit -m "Remove stray zero from empty canvas"
          git push
